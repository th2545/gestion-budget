<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mon budget étudiant</title>
<meta name="theme-color" content="#1e1a4d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Budgy">
<link rel="icon" href="./app-icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" sizes="180x180" href="./app-icon-180.png">
<link rel="manifest" href="./manifest.webmanifest">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#efebff;--card:#fff;--ink:#1e1a4d;--mut:#6f6a9a;--line:#e0daf7;--ok:#0f9d78;--bad:#e5484d;--hero:#1e1a4d;
--c1:#6c63ff;--c2:#ffb020;--c3:#19c3a0;--c4:#ff5c8a;--c5:#3d9bff;--c6:#ff8a4c;
box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--bg:#12102b;--card:#1d1a44;--ink:#f2efff;--mut:#a7a2d6;--line:#2e2a63;--ok:#43d9ae;--bad:#ff7a80;--hero:#2a2575}
:root[data-theme="ocean"]{--bg:#e8f6ff;--card:#fff;--ink:#123b58;--mut:#537c94;--line:#c5e2f2;--ok:#087d70;--bad:#d64058;--hero:#075985;--c1:#0284c7;--c2:#f59e0b;--c3:#14b8a6;--c4:#f472b6;--c5:#6366f1;--c6:#fb923c}
:root[data-theme="sunset"]{--bg:#fff0e8;--card:#fffaf6;--ink:#542b3a;--mut:#96717b;--line:#f4d4c8;--ok:#16856c;--bad:#d94354;--hero:#8f3452;--c1:#e45c78;--c2:#f4a261;--c3:#48a999;--c4:#c8557d;--c5:#638ad4;--c6:#ed7d3a}
:root[data-theme="mint"]{--bg:#e9f7ef;--card:#fff;--ink:#173d32;--mut:#5e8274;--line:#c8e5d4;--ok:#13845c;--bad:#d44957;--hero:#176b57;--c1:#21a179;--c2:#e7a62f;--c3:#38b2ac;--c4:#ed7092;--c5:#5488d8;--c6:#e78845}
:root[data-theme="rose"]{--bg:#fff0f5;--card:#fffafd;--ink:#4b2038;--mut:#95677f;--line:#f2d5e2;--ok:#16856c;--bad:#d94354;--hero:#8d315f;--c1:#d94f91;--c2:#f2a65a;--c3:#45aa91;--c4:#ec6c78;--c5:#7788dc;--c6:#d88b52}
:root[data-theme="forest"]{--bg:#edf4e9;--card:#fbfdf8;--ink:#263d2b;--mut:#6a806c;--line:#d5e2d0;--ok:#19805b;--bad:#ce5353;--hero:#315d42;--c1:#47865b;--c2:#d4a23d;--c3:#53a992;--c4:#d87970;--c5:#638bc1;--c6:#ba8050}
:root[data-theme="midnight"]{--bg:#101820;--card:#1a2730;--ink:#edf5f2;--mut:#a0b3b0;--line:#30434a;--ok:#50d1a2;--bad:#ff8087;--hero:#153b43;--c1:#43c6ac;--c2:#f0b857;--c3:#53b6cc;--c4:#ed7e9b;--c5:#8e9cf2;--c6:#f0935e}
@media (prefers-color-scheme:dark){:root[data-theme="system"]{--bg:#12102b;--card:#1d1a44;--ink:#f2efff;--mut:#a7a2d6;--line:#2e2a63;--ok:#43d9ae;--bad:#ff7a80;--hero:#2a2575}}
*{box-sizing:border-box}
html{color-scheme:light;background:var(--bg)}
:root[data-theme="dark"]{color-scheme:dark}
:root[data-theme="midnight"]{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.45}
main{max-width:560px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top,0px)) 16px 120px}
h1{font-family:'Unbounded','DM Sans',system-ui,sans-serif;font-size:1.45rem;margin:0 0 6px;font-weight:700;letter-spacing:-.02em}
h2{font-family:'Unbounded','DM Sans',system-ui,sans-serif;font-size:.95rem;margin:0 0 12px;font-weight:500}
p.s{color:var(--mut);margin:0 0 18px}
.card{background:var(--card);border-radius:28px;padding:20px;margin-bottom:14px}
label{display:block;font-weight:700;margin:16px 0 6px}
input{width:100%;font:inherit;font-size:1.05rem;padding:14px 16px;border-radius:16px;border:2px solid transparent;background:var(--bg);color:var(--ink)}
input:focus{outline:0;border-color:var(--c1)}
button:focus-visible,summary:focus-visible{outline:3px solid var(--c1);outline-offset:2px}
button{font:inherit;cursor:pointer}
.btn{width:100%;margin-top:18px;padding:15px;border:0;border-radius:18px;background:var(--c1);color:#fff;font-weight:700;font-size:1rem;transition:transform .15s}
.btn:active{transform:scale(.97)}
.hero{margin:0 0 14px;padding:16px 18px 18px;background:var(--hero);color:#fff;border-radius:28px;position:sticky;top:calc(8px + env(safe-area-inset-top,0px));z-index:15;box-shadow:0 14px 30px -14px rgba(30,26,77,.55);transition:padding .25s}
.hero.mini{padding:10px 18px 12px}.hero.mini .top,.hero.mini .of,.hero.mini .mood{display:none}.hero.mini .two .k{font-size:.7rem}.hero.mini .mid2{font-size:1rem}.hero.mini .big{font-size:1.5rem}.hero.mini .stack{margin:8px 0 0;height:14px}
.hero .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:.85rem;opacity:.85}
.hero h1{font-size:.95rem;margin:0}
.hero .k{margin:10px 0 0;opacity:.7}
.hero .of{margin:2px 0 0;opacity:.7}
.hero .bad{color:#ff9a9e}
.big{font-family:'Unbounded','DM Sans',system-ui,sans-serif;font-size:clamp(1.6rem,7.5vw,2.2rem);font-weight:700;line-height:1.1;letter-spacing:-.03em;display:inline-block}
.two{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin-top:10px}.two>div{min-width:0}.rs{text-align:right}.two .k{margin:0 0 2px;font-size:.8rem}
.mid2{font-family:'Unbounded','DM Sans',system-ui,sans-serif;font-weight:500;font-size:1.1rem;letter-spacing:-.02em}
.stack{position:relative;display:flex;gap:3px;height:22px;border-radius:99px;background:rgba(255,255,255,.14);margin:14px 0 4px}
.stack i{display:block;height:100%;width:0;border-radius:99px;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.tick{position:absolute;top:-6px;bottom:-6px;width:3px;border-radius:3px;background:#fff;transform:translateX(-1.5px)}
.hint{display:none}
.mood{margin:12px 0 0;font-weight:700}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0;position:relative}
.duo div{background:var(--card);border-radius:22px;padding:14px 16px;box-shadow:0 12px 28px -14px rgba(30,26,77,.45)}
.duo span{display:block;font-size:.8rem;color:var(--mut)}
.duo b{font-family:'Unbounded','DM Sans',system-ui,sans-serif;font-size:1.05rem;font-weight:500}
.pace:empty{display:none}.pace{text-align:center;color:var(--mut);margin:14px 0 0}
.pace b{color:var(--ok)}
.h{font-family:'Unbounded','DM Sans',system-ui,sans-serif;font-size:.95rem;font-weight:500;margin:26px 0 12px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip,.vw{padding:10px 15px;border-radius:99px;border:0;background:var(--bg);color:var(--ink);font-weight:700;transition:transform .15s,background .2s}
.chip:active,.vw:active{transform:scale(.94)}
.chip[aria-pressed="true"],.vw[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.tile{position:relative;overflow:hidden;text-align:left;padding:16px;border-radius:26px;min-height:124px;background:var(--card);color:var(--ink);display:flex;flex-direction:column;justify-content:flex-end;gap:2px}
.tile[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 3px var(--col)}
.tile>*:not(.fill){position:relative}
.tile .fill{position:absolute;left:0;right:0;bottom:0;height:0;background:color-mix(in srgb,var(--col) 40%,transparent);transition:height 1s cubic-bezier(.2,.8,.2,1)}
.tile.over .fill{background:color-mix(in srgb,var(--bad) 50%,transparent)}
.tile .em{font-size:1.9rem;line-height:1;margin-bottom:auto;padding-bottom:12px}
.tile .nm{font-weight:700}
.tile .am{font-family:'Unbounded','DM Sans',system-ui,sans-serif;font-size:.8rem}
.tile .am small{font-family:'DM Sans',system-ui,sans-serif;color:var(--mut);font-size:.75rem}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.stat{background:var(--bg);border-radius:18px;padding:12px}
.stat span{display:block;color:var(--mut);font-size:.8rem}
.stat b{font-family:'Unbounded','DM Sans',system-ui,sans-serif;font-size:.95rem;font-weight:500}
.pb{margin:8px 0}.pb small{display:flex;justify-content:space-between;color:var(--mut)}
.cat{margin:16px 0}
.cat .t{display:flex;justify-content:space-between;gap:8px;font-weight:700}
.bar{height:12px;border-radius:99px;background:var(--bg);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;width:0;border-radius:99px;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.row{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.row .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.row .n small{color:var(--mut);display:block}
.x{border:0;background:none;color:var(--mut);font-size:1.2rem;padding:4px 8px}
.bad{color:var(--bad)}.ok{color:var(--ok)}
details summary{cursor:pointer;font-weight:700}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lnk{background:none;border:0;color:var(--bad);font-weight:700;margin-top:14px;padding:0}
.empty{color:var(--mut);margin:0}
.tp details{border-top:1px solid var(--line);padding:13px 0}.tp details:first-child{border-top:0}.tp p{margin:8px 0 0;color:var(--mut)}
.chat-log{display:grid;gap:10px;margin:12px 0}
.chat-message{max-width:92%;padding:11px 14px;border-radius:18px;background:var(--bg);white-space:pre-wrap;overflow-wrap:anywhere}
.chat-message.user{justify-self:end;background:var(--c1);color:#fff}
.chat-form{display:flex;gap:8px;align-items:stretch}
.chat-form input{min-width:0}
.chat-form button{flex:none;padding:0 16px;border:0;border-radius:16px;background:var(--c1);color:#fff;font-weight:700}
.chat-note{margin:10px 0 0;color:var(--mut);font-size:.82rem}
.chat-launch,.form-toggle{display:flex;align-items:center;gap:12px;width:100%;padding:12px 16px;border:0;border-radius:22px;background:var(--card);color:var(--ink);text-align:left;font-weight:700;box-shadow:0 8px 22px -14px rgba(30,26,77,.55)}
.chat-avatar{width:48px;height:48px;display:grid;place-items:center;flex:none;border-radius:50%;background:var(--c1);font-size:1.6rem}
.chat-launch small{display:block;color:var(--mut);font-weight:400}
.chat-panel,.form-panel{margin-top:12px}
.form-panel .card{margin-bottom:0}
.form-toggle{margin:14px 0}
.form-toggle small{display:block;margin-top:3px;color:var(--mut);font-size:.84rem;font-weight:400}
.form-toggle-icon{width:42px;height:42px;display:grid;place-items:center;flex:none;border-radius:50%;background:var(--bg);font-size:1.35rem}
.expense-toggle{position:relative;min-height:76px;margin:18px 0;padding:14px 18px;border:1px solid color-mix(in srgb,var(--c1) 22%,var(--line));background:linear-gradient(115deg,color-mix(in srgb,var(--c1) 10%,var(--card)),var(--card) 72%);box-shadow:0 12px 28px -16px color-mix(in srgb,var(--c1) 55%,transparent);transition:transform .18s,box-shadow .18s}
.expense-toggle:hover{transform:translateY(-2px);box-shadow:0 16px 30px -15px color-mix(in srgb,var(--c1) 60%,transparent)}
.expense-toggle .form-toggle-icon{width:48px;height:48px;background:var(--c1);color:#fff;font-size:1.5rem}
.expense-toggle-label{flex:1}
.form-toggle-arrow{font-size:1.8rem;line-height:1;color:var(--c1);transition:transform .18s}
.expense-toggle[aria-expanded="true"] .form-toggle-arrow{transform:rotate(90deg)}
.theme-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.theme-option{display:flex;align-items:center;gap:10px;padding:12px;border:2px solid transparent;border-radius:18px;background:var(--bg);color:var(--ink);text-align:left;font-weight:700}
.theme-option[aria-pressed="true"]{border-color:var(--c1)}
.theme-swatch{width:28px;height:28px;flex:none;border-radius:50%;background:var(--swatch)}
.afford-section{margin:14px 0}
.afford-panel{margin:12px 0 0}
.afford-panel .card{margin-bottom:0}
.forecast{margin:0 0 14px}
.forecast-row{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-top:1px solid var(--line)}
.forecast-row:first-of-type{border-top:0}
.tile .am small.planned-amount{display:block;color:var(--mut)}
.forecast-row span{min-width:0}
.forecast-row small{display:block;color:var(--mut)}
.alert-list{margin:0;padding-left:22px}
.alert-list li{margin:7px 0}
.month-summary{margin-top:14px}
.plan-form{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.plan-form .wide{grid-column:1/-1}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:4px;padding:6px;background:var(--ink);border-radius:99px;z-index:20;box-shadow:0 14px 30px -10px rgba(30,26,77,.6)}
.tb{border:0;background:none;color:var(--bg);padding:11px 16px;border-radius:99px;font-weight:700;white-space:nowrap}
.tb[aria-pressed="true"]{background:var(--bg);color:var(--ink)}
select,textarea{width:100%;font:inherit;font-size:1.05rem;padding:14px 16px;border-radius:16px;border:2px solid transparent;background:var(--bg);color:var(--ink)}
select:focus,textarea:focus{outline:0;border-color:var(--c1)}
textarea{resize:none;font-size:.78rem;word-break:break-all}
h3.sub{font-family:'Unbounded','DM Sans',system-ui,sans-serif;font-size:.9rem;font-weight:500;margin:26px 0 6px}
.pr{margin:12px 0 0;font-weight:700;color:var(--mut)}
.bar.tall{height:20px}.gl{margin:10px 0 2px;font-size:1.05rem}
.plot{position:relative;height:170px;margin-top:24px;display:flex;gap:8px;align-items:flex-end}
.col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;min-width:0}
.col i{display:block;width:100%;height:0;border-radius:12px 12px 4px 4px;transition:height 1s cubic-bezier(.2,.8,.2,1)}
.col small{font-size:.66rem;color:var(--mut);margin-bottom:3px;white-space:nowrap}
.bl{position:absolute;left:0;right:0;border-top:2px dashed var(--mut);opacity:.6}
.bl span{position:absolute;right:0;top:-18px;font-size:.7rem;color:var(--mut)}
.lbls{display:flex;gap:8px;margin-top:6px}.lbls span{flex:1;text-align:center;font-size:.75rem;color:var(--mut);min-width:0}
.cmp{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.cmp:first-of-type{border-top:0}
.agenda-week{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:12px 0}
.agenda-week button{border:0;border-radius:14px;padding:9px 13px;background:var(--bg);color:var(--ink);font-weight:700}
.agenda-week-label{font-weight:700;text-align:center}
.agenda-days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin:14px 0}
.agenda-day{min-width:0;min-height:84px;padding:8px 3px;border:1px solid var(--line);border-radius:16px;background:var(--bg);color:var(--ink);text-align:center}
.agenda-day[aria-pressed="true"]{border-color:var(--c1);box-shadow:inset 0 0 0 1px var(--c1);background:color-mix(in srgb,var(--c1) 9%,var(--card))}
.agenda-day-name,.agenda-day-date,.agenda-day-total{display:block}
.agenda-day-name{font-size:.65rem;color:var(--mut)}
.agenda-day-date{font-weight:700;font-size:1.05rem}
.agenda-day-total{font-size:.62rem;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.agenda-day-total.income{color:var(--ok)}
.agenda-day-total.expense{color:var(--bad)}
.agenda-detail-title{margin:18px 0 4px;font-weight:700}
.agenda-movement{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.agenda-movement:first-of-type{border-top:0}
.agenda-movement .n{flex:1;min-width:0;overflow-wrap:anywhere}
.agenda-movement .n small{display:block;color:var(--mut)}
.agenda-movement b{white-space:nowrap}
.agenda-legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;color:var(--mut);font-size:.8rem}
.agenda-legend span{display:inline-flex;align-items:center;gap:5px}
.agenda-legend i{width:9px;height:9px;border-radius:50%;background:var(--bad)}
.agenda-legend .income i{background:var(--ok)}
.livret-page{max-width:1040px}
.livret-hero{position:relative;overflow:hidden;margin:2px 0 18px;padding:28px 30px;border-radius:30px;background:linear-gradient(125deg,var(--hero),color-mix(in srgb,var(--c1) 72%,var(--hero)));color:#fff;box-shadow:0 18px 40px -24px color-mix(in srgb,var(--hero) 75%,transparent)}
.livret-hero:after{content:"";position:absolute;width:230px;height:230px;right:-55px;top:-105px;border:1px solid rgba(255,255,255,.16);border-radius:50%;box-shadow:0 0 0 28px rgba(255,255,255,.045),0 0 0 58px rgba(255,255,255,.035)}
.livret-hero-top{position:relative;z-index:1;display:flex;align-items:flex-start;gap:16px}
.livret-hero-icon{display:grid;place-items:center;flex:none;width:58px;height:58px;border:1px solid rgba(255,255,255,.22);border-radius:20px;background:rgba(255,255,255,.13);font-size:1.9rem}
.livret-kicker{margin:1px 0 7px;color:rgba(255,255,255,.72);font-size:.72rem;font-weight:700;letter-spacing:.13em}
.livret-hero h1{margin:0;font-size:clamp(1.25rem,4vw,1.8rem)}
.livret-hero p:last-child{position:relative;z-index:1;max-width:580px;margin:17px 0 0;color:rgba(255,255,255,.82);font-size:.94rem}
.livret-layout{display:grid;grid-template-columns:minmax(0,.92fr) minmax(0,1.08fr);align-items:start;gap:16px}
.livret-layout>.card{min-width:0;padding:22px}
.livret-card-heading{display:flex;align-items:center;gap:11px;margin-bottom:16px}
.livret-card-heading-icon{display:grid;place-items:center;width:42px;height:42px;flex:none;border-radius:15px;background:color-mix(in srgb,var(--c1) 12%,var(--bg));font-size:1.25rem}
.livret-card-heading h2{margin:0}
.livret-card-heading p{margin:3px 0 0;color:var(--mut);font-size:.8rem}
.livret-assumption{margin:0 0 12px;padding:13px 14px;border:1px solid color-mix(in srgb,var(--c1) 18%,var(--line));border-radius:17px;background:color-mix(in srgb,var(--c1) 6%,var(--card));color:var(--mut);font-size:.82rem}
.livret-assumption strong{display:block;margin-bottom:3px;color:var(--ink);font-size:.88rem}
.livret-form{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.livret-form .wide{grid-column:1/-1}
.livret-form label,.livret-withdrawal label{margin-top:13px;font-size:.83rem}
.livret-form input,.livret-form select,.livret-withdrawal input{padding:12px 13px;border-radius:14px;font-size:.95rem}
.livret-form select{min-height:49px}
.livret-results{display:grid;gap:12px}
.livret-result{position:relative;overflow:hidden;padding:17px;border:1px solid var(--line);border-radius:21px;background:linear-gradient(145deg,color-mix(in srgb,var(--c1) 5%,var(--card)),var(--card) 65%)}
.livret-result:before{content:"";position:absolute;left:0;top:17px;bottom:17px;width:4px;border-radius:0 4px 4px 0;background:var(--livret-accent,var(--c1))}
.livret-result[data-livret="ldds"]{--livret-accent:var(--c3)}
.livret-result-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.livret-result-icon{display:grid;place-items:center;width:40px;height:40px;flex:none;border-radius:14px;background:color-mix(in srgb,var(--livret-accent,var(--c1)) 14%,var(--card));font-size:1.2rem}
.livret-result h3{flex:1;margin:0;font-family:'Unbounded','DM Sans',system-ui,sans-serif;font-size:.88rem;font-weight:500}
.livret-cap{padding:5px 9px;border-radius:99px;background:color-mix(in srgb,var(--livret-accent,var(--c1)) 10%,var(--card));color:var(--mut);font-size:.7rem;font-weight:700;white-space:nowrap}
.livret-result .stats{margin-top:0}
.livret-result .stat{padding:12px;border:1px solid color-mix(in srgb,var(--line) 75%,transparent);background:color-mix(in srgb,var(--card) 78%,transparent)}
.livret-result .stat:first-child{grid-column:1/-1;padding:15px;background:var(--livret-accent,var(--c1));color:#fff}
.livret-result .stat:first-child span{color:rgba(255,255,255,.8)}

.livret-empty{margin:10px 0;padding:10px 12px;border-radius:13px;background:var(--bg);color:var(--mut);font-size:.82rem}
.livret-withdrawal{display:grid;grid-template-columns:1fr 1fr auto;align-items:end;gap:8px}
.livret-withdrawal .vw{width:46px;height:46px;margin-bottom:2px;border-radius:14px;background:var(--c1);color:white;font-size:1.35rem}

.livret-sim-toggle{margin:0 0 14px;padding:17px 18px;border:1px solid color-mix(in srgb,var(--c1) 20%,var(--line));background:linear-gradient(115deg,color-mix(in srgb,var(--c1) 9%,var(--card)),var(--card) 78%);cursor:pointer}

@media (max-width:760px){.livret-layout{grid-template-columns:1fr;gap:12px}.livret-hero{padding:23px 20px;border-radius:25px}.livret-layout>.card{padding:18px}}
@media (max-width:390px){.livret-form{grid-template-columns:1fr}.livret-form .wide{grid-column:auto}.livret-withdrawal{grid-template-columns:1fr 1fr}.livret-withdrawal .vw{grid-column:1/-1;width:100%;height:44px}.livret-result{padding:15px 13px}.livret-cap{font-size:.64rem;padding:5px 7px}}

<body>
<main id="app"></main>
<script>
var KEY='budget-v1';
var CATS=[
{id:'logement',n:'Logement',e:'🏠',c:'--c1',p:35},
{id:'courses',n:'Courses',e:'🛒',c:'--c2',p:20},
{id:'essence',n:'Essence',e:'⛽',c:'--c3',p:10},
{id:'loisirs',n:'Loisirs',e:'🎉',c:'--c4',p:10},
{id:'epargne',n:'Épargne',e:'🐷',c:'--c5',p:15},
{id:'autres',n:'Études & autres',e:'📚',c:'--c6',p:10}];
var NM={sem:['cette semaine','de la semaine','la semaine'],quinz:['cette quinzaine','de la quinzaine','la quinzaine'],mois:['ce mois-ci','du mois','le mois'],an:['cette année','de l’année','l’année'],autre:['cette période','de la période','la période']};
var FQ=[['sem','Semaine'],['quinz','2 semaines'],['mois','Mois'],['an','Année'],['autre','Autre']];
var RM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
var S=null,sel='essence',ff='mois',pop=false,toast='',D=864e5,tab='budget',agendaWeekOffset=0,agendaSelectedDate=null;
var settingsIncomeOpen=false,settingsRecurringOpen=false,livretEditingOpen=false,livretWithdrawalsOpen=false,livretDraft=null;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
if(S){S.freq=S.freq||'mois';S.biz=S.biz||[];S.bt=S.bt||[];S.planned=S.planned||[];S.goalMoves=S.goalMoves||[];S.incomeDate=S.incomeDate||S.pstart||today();S.livretSim=S.livretSim||{initial:0,monthly:0,day:1,years:5,rateMode:'current',customRate:1.7,withdrawals:[]};S.livretSim.withdrawals=S.livretSim.withdrawals||[];S.theme=S.theme||'system';S.alertAt=S.alertAt||80}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function setTheme(theme){document.documentElement.setAttribute('data-theme',theme)}
function fmt(n){return (Math.round(n*100)/100).toLocaleString('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:2,minimumFractionDigits:0})}
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}
function num(v){return parseFloat(String(v).replace(',','.').replace(/\s/g,''))}
function q(s){return Array.prototype.slice.call(document.querySelectorAll(s))}
function cat(id){return CATS.filter(function(c){return c.id===id})[0]||CATS[5]}
function today(){var n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate()).getTime()}
var app=document.getElementById('app');

function per(){var n=new Date(),t0=today(),f=S.freq,s,e;
if(f==='mois'){s=new Date(n.getFullYear(),n.getMonth(),1).getTime();e=new Date(n.getFullYear(),n.getMonth()+1,1).getTime()}
else if(f==='sem'){s=t0-((n.getDay()+6)%7)*D;e=s+7*D}
else if(f==='an'){s=new Date(n.getFullYear(),0,1).getTime();e=new Date(n.getFullYear()+1,0,1).getTime()}
else{var L=(f==='quinz'?14:Math.max(1,S.days||10))*D,p=S.pstart||t0;s=p+Math.floor((t0-p)/L)*L;e=s+L}
return{s:s,e:e}}
function dateStamp(value){var p=value.split('-');return new Date(+p[0],+p[1]-1,+p[2]).getTime()}
function dateValue(time){var d=new Date(time);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function pendingByCategory(range){var pending={};CATS.forEach(function(c){pending[c.id]=0});
(S.planned||[]).forEach(function(e){if(e.t>=range.s&&e.t<range.e)pending[e.c]=(pending[e.c]||0)+e.a});
return pending}
function planUI(){var P=per(),h='<div class="card"><h2>Achats prévus</h2><p class="s">Ils sont réservés sans être comptés comme dépenses effectuées. La prévision tient compte des achats prévus dans la période.</p>';
var planned=(S.planned||[]).slice().sort(function(a,b){return a.t-b.t});
if(!planned.length)h+='<p class="empty">Aucun achat prévu.</p>';
planned.forEach(function(e){var c=cat(e.c);h+='<div class="forecast-row"><span>'+esc(e.n)+'<small>'+c.e+' '+c.n+' · prévu le '+new Date(e.t).toLocaleDateString('fr-FR',{day:'numeric',month:'short'})+(e.t>=P.s&&e.t<P.e?' · cette période':'')+'</small></span><b>'+fmt(e.a)+'</b><button type="button" class="x" data-paid="'+esc(e.id)+'" aria-label="Marquer comme payé : '+esc(e.n)+'">✓</button><button type="button" class="x" data-planx="'+esc(e.id)+'" aria-label="Supprimer l’achat prévu : '+esc(e.n)+'">×</button></div>'});
h+='<button type="button" class="form-toggle" id="plan-toggle" aria-expanded="false" aria-controls="plan-panel"><span class="form-toggle-icon" aria-hidden="true">📝</span><span>Ajouter un achat prévu<small>Appuie ici pour saisir les détails</small></span></button><div class="form-panel" id="plan-panel" hidden><div class="card"><div class="plan-form"><div class="wide"><label for="pn">Nom de l’achat</label><input id="pn" placeholder="ex. Chaussures" autocomplete="off"></div><div><label for="pa">Montant</label><input id="pa" inputmode="decimal" placeholder="ex. 60"></div><div><label for="pt">Date prévue</label><input id="pt" type="date" min="'+dateValue(today())+'" value="'+dateValue(today())+'"></div><div class="wide"><label for="pcat">Catégorie</label><select id="pcat">'+CATS.filter(function(c){return c.id!=='epargne'}).map(function(c){return '<option value="'+c.id+'">'+c.e+' '+c.n+'</option>'}).join('')+'</select></div></div><p id="plan-err" class="bad" role="alert"></p><button class="btn" id="plan-add" type="button">Enregistrer l’achat prévu</button></div></div></div>';
return h}
function bindPlans(){var add=document.getElementById('plan-add');if(!add)return;
bindFormToggle('plan-toggle','plan-panel','pn');
add.onclick=function(){var n=document.getElementById('pn').value.trim(),a=num(document.getElementById('pa').value),date=document.getElementById('pt').value,err=document.getElementById('plan-err');
if(!n||!(a>0)||!date){err.textContent='Indique un achat, un montant supérieur à 0 et une date.';return}
var when=dateStamp(date);if(when<today()){err.textContent='La date prévue ne peut pas être dans le passé.';return}
var id='p'+Date.now();while(S.planned.some(function(e){return e.id===id}))id+='x';
S.planned.push({id:id,n:n,a:a,c:document.getElementById('pcat').value,t:when});save();toast='📝 Achat prévu ajouté';dash()};
q('[data-paid]').forEach(function(b){b.onclick=function(){var e=S.planned.filter(function(x){return x.id===b.dataset.paid})[0];if(!e)return;S.exp.push({a:e.a,c:e.c,n:e.n,t:Date.now()});S.planned=S.planned.filter(function(x){return x.id!==e.id});save();toast='✅ Achat marqué comme payé';dash()}});
q('[data-planx]').forEach(function(b){b.onclick=function(){S.planned=S.planned.filter(function(e){return e.id!==b.dataset.planx});save();toast='Achat prévu supprimé';dash()}})}
function bindFormToggle(toggleId,panelId,focusId){var toggle=document.getElementById(toggleId),panel=document.getElementById(panelId);if(!toggle||!panel)return;
toggle.onclick=function(){panel.hidden=!panel.hidden;toggle.setAttribute('aria-expanded',!panel.hidden);if(!panel.hidden&&focusId)document.getElementById(focusId).focus()}}
function availableBalance(){var P=per(),spent={},pending=pendingByCategory(P),all=0,reserved=0,goals=0;
CATS.forEach(function(c){spent[c.id]=0});
S.exp.forEach(function(e){all+=e.a;if(e.t>=P.s&&e.t<P.e)spent[e.c]=(spent[e.c]||0)+e.a});
CATS.forEach(function(c){var left=Math.max(0,(S.budgets[c.id]||0)-(spent[c.id]||0));reserved+=left+Math.max(0,pending[c.id]-left)});
(S.planned||[]).forEach(function(e){if(e.t<P.s||e.t>=P.e)reserved+=e.a});
(S.goals||[]).forEach(function(g){goals+=g.s||0});
var businessBalance=(S.bt||[]).reduce(function(s,e){if(e.k==='t')return s+(e.direction==='in'?e.a:-e.a);return s+(e.d?e.g:0)},0);
return S.balance-all+businessBalance-reserved-goals}

function fqui(cur,d){var h='<div class="chips">';
FQ.forEach(function(x){h+='<button type="button" class="vw fq" data-f="'+x[0]+'" aria-pressed="'+(x[0]===cur)+'">'+x[1]+'</button>'});
return h+'</div><div id="dw" '+(cur==='autre'?'':'hidden')+'><label for="dd">Tous les combien de jours ?</label><input id="dd" inputmode="numeric" value="'+(d||'')+'" placeholder="ex. 10"></div>'}
function bindFq(){q('.fq').forEach(function(b){b.onclick=function(){ff=b.dataset.f;q('.fq').forEach(function(x){x.setAttribute('aria-pressed',x===b)});document.getElementById('dw').hidden=ff!=='autre'}})}

function countUp(el,to){if(RM){el.textContent=fmt(to);return}
var t0=performance.now();function st(t){var p=Math.min((t-t0)/900,1),e=1-Math.pow(1-p,3);el.textContent=fmt(to*e);if(p<1)requestAnimationFrame(st)}requestAnimationFrame(st)}

function tabs(){var T=[['budget','📊','Budget'],['obj','🎯','Objectifs'],['hist','📅','Historique'],['biz','💼','Business'],['livrets','📈','Livrets'],['tips','💡','Astuces'],['settings','⚙️','Réglages']],h='<nav class="nav" aria-label="Navigation">';T.forEach(function(t){h+='<button type="button" class="tb" data-t="'+t[0]+'" aria-pressed="'+(tab===t[0])+'" aria-label="'+t[2]+'">'+t[1]+'<span> '+t[2]+'</span></button>'});return h+'</nav>'}
function bindTabs(){q('.tb').forEach(function(b){b.onclick=function(){tab=b.dataset.t;dash();window.scrollTo(0,0)}})}
var TIPS=[
['⚖️','La règle 50 / 30 / 20','Vise 50 % pour les besoins (logement, courses, transport), 30 % pour les envies (sorties, loisirs) et 20 % pour l’épargne. Si c’est trop serré, commence par 5 % d’épargne et augmente petit à petit.'],
['✍️','Note chaque dépense tout de suite','Ajoute la dépense dans l’appli juste après l’achat. Au bout d’une semaine, tu verras où part vraiment ton argent.'],
['⏳','La règle des 24 heures','Pour un achat non prévu, attends une journée. Si tu en as toujours envie demain, c’est un vrai besoin.'],
['🐷','Mets de côté en premier','Dès que tes revenus arrivent, mets ta part d’épargne de côté avant de dépenser le reste. Un fonds de sécurité d’environ un mois de dépenses évite bien des galères.'],
['🛒','Courses moins chères','Fais une liste, mange avant d’y aller, prends les marques distributeur et compare le prix au kilo. Cuisine en grande quantité et congèle des portions. Les restos universitaires et les applis anti-gaspi coûtent souvent bien moins cher qu’un repas dehors.'],
['⛽','Essence et transports','Covoiturage avec d’autres étudiants, vélo ou transports en commun avec tarif jeune quand c’est possible. Compare les prix des stations avant de faire le plein et regroupe tes trajets.'],
['🎉','Loisirs sans se ruiner','Cherche les tarifs étudiants et les activités gratuites. Fixe-toi une somme de sorties pour la période et arrête-toi quand la barre est pleine.'],
['📱','Fais le tri dans tes abonnements','Liste tes abonnements (streaming, musique, salle de sport). Garde ceux que tu utilises vraiment ou partage-les avec des amis quand c’est autorisé.'],
['🏠','Aides à connaître','Renseigne-toi sur l’APL (CAF), les bourses du CROUS, la garantie Visale pour la caution du logement et les aides de ta région ou de ton école. Vérifie les conditions et les montants à jour sur les sites officiels.']];
var BUSINESS_TIPS=[
['📊','Calcule ta vraie marge','Pour chaque vente, retire du prix les coûts directs (achat ou fabrication, emballage, livraison, frais de plateforme et commissions). Suis aussi les charges fixes séparément : chiffre d’affaires et bénéfice ne sont pas la même chose.'],
['🎯','Teste la demande avant d’investir','Parle à des clients potentiels, compare les offres existantes et essaie une petite série ou un prototype. Fixe un budget de test et un critère de réussite avant d’acheter beaucoup de stock ou du matériel.'],
['💶','Fixe un prix rentable','Additionne tes coûts variables par vente, puis vérifie que le prix couvre aussi une part réaliste des charges fixes, impôts et cotisations. Compare les prix du marché, mais ne copie pas un prix sans connaître tes propres coûts.'],
['💧','Protège ta trésorerie','Prévois les délais entre une dépense et le paiement du client, les retours, les périodes creuses et les factures à venir. Garde une réserve pour les besoins essentiels avant de réinvestir tout ton argent.'],
['📈','Suis le marché avec des sources datées','Observe régulièrement les prix, les avis clients, les nouveautés et les offres concurrentes. Pour la France, consulte notamment les études de l’INSEE, les ressources de Bpifrance Création et les informations de la Banque de France. Vérifie toujours la date, le périmètre et la source des chiffres : Budgy ne reçoit pas de données de marché en direct.'],
['🧪','Décide avec des scénarios','Avant un achat important, calcule combien d’unités tu dois vendre pour couvrir son coût. Compare un scénario prudent, un scénario réaliste et un scénario optimiste, puis n’engage que le montant que tu peux supporter de perdre.']];
var chatMessages=[];
function offlineAnswer(question){var q=question.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
if(/livret a|livret|ldds|developpement durable et solidaire/.test(q))return 'Le Livret A et le LDDS sont des livrets d’épargne réglementés en France : le capital est garanti, l’argent reste disponible et les intérêts sont exonérés d’impôt et de prélèvements sociaux. Le Livret A est ouvert à tous, avec un plafond de versements de 22 950 €. Le LDDS est réservé aux personnes majeures domiciliées fiscalement en France, avec un plafond de 12 000 €. Le taux est fixé par l’État et peut évoluer ; au 27 octobre 2026, Budgy utilise 1,7 % pour chacun. Les intérêts sont calculés par quinzaine et versés une fois par an. Tu peux comparer les deux dans l’onglet « Livrets » ; vérifie les conditions auprès de ta banque.';
if(/business|entrepren|entreprise|rentab|client|chiffre d'affaires|marge|prix de vente|vente|stock|tresorer|concurr|marche|marcher|demande|investir dans|investissement professionnel/.test(q))return 'Pour améliorer la rentabilité d’une activité, calcule la marge réelle par vente en retirant achat/fabrication, livraison, commissions et autres coûts variables, puis suis les charges fixes et la trésorerie. Avant d’investir dans du stock ou du matériel, teste la demande à petite échelle et calcule le seuil de rentabilité. Pour étudier le marché, compare les offres et les avis clients et consulte des données datées de sources comme l’INSEE, Bpifrance Création ou la Banque de France. Je suis hors ligne : je ne peux pas fournir les prix, tendances ou chiffres du marché en temps réel. Pour un placement financier ou une décision fiscale/juridique, vérifie les sources officielles et demande un avis professionnel adapté.';
if(/invest|placement|bourse|action|crypto|pea|etf|livret/.test(q))return 'Pour investir, commence par vérifier que tu as une épargne de précaution disponible et que tes dépenses essentielles sont couvertes. Un placement peut baisser : n’investis que l’argent dont tu n’as pas besoin à court terme, comprends les frais et les risques, et méfie-toi des promesses de rendement garanti. Les crypto-actifs sont particulièrement volatils. Je ne peux pas choisir un placement adapté à ta situation ; compare les informations officielles ou demande conseil à un professionnel agréé.';
if(/budget|depens|argent|gerer|gestion|fin de mois|reste/.test(q))return 'Pour mieux gérer ton budget, commence par noter tes revenus et dépenses fixes, puis fixe une limite réaliste pour les dépenses variables. Garde une petite marge pour les imprévus et regarde chaque semaine les catégories où tu dépenses le plus. Tu peux aussi ajuster les montants dans Réglages.';
if(/epargn|econom|mettre de cote|mettre de l'argent de cote|urgence|imprevu/.test(q))return 'Choisis un objectif simple et un montant régulier, même petit, à mettre de côté dès que tu reçois tes revenus. Constitue d’abord une réserve accessible pour les imprévus. Évite de bloquer l’argent dont tu pourrais avoir besoin bientôt.';
if(/dette|credit|emprunt|decouvert/.test(q))return 'Fais la liste des sommes dues, des échéances et des taux. Priorise les paiements essentiels et les dettes aux frais les plus élevés, et contacte rapidement l’organisme concerné si tu risques un retard. Évite de prendre un nouveau crédit pour en rembourser un autre sans conseil adapté.';
if(/achat|acheter|permettre/.test(q))return 'Avant un achat, vérifie le montant restant dans la catégorie concernée et garde une marge pour les dépenses indispensables. Pour un achat non urgent, attendre 24 heures aide souvent à décider. Tu peux aussi utiliser « Puis-je me le permettre ? » dans Astuces.';
return 'Je fonctionne hors ligne avec quelques thèmes de conseils, pas comme une IA connectée. Essaie une question sur le budget, l’épargne, les dettes, un achat ou l’investissement. Pour une décision financière personnelle, vérifie les informations auprès d’une source officielle ou d’un professionnel qualifié.'}
function bindChat(){var form=document.getElementById('chat-form'),toggle=document.getElementById('chat-toggle'),panel=document.getElementById('chat-panel');if(!form||!toggle||!panel)return;
function render(){var log=document.getElementById('chat-log');log.innerHTML='';
if(!chatMessages.length)chatMessages.push({role:'assistant',text:'Salut ! Je peux donner des repères généraux sur ton budget, l’épargne, les dettes, l’investissement et la rentabilité d’une activité. Essaie : « C’est quoi le Livret A et le LDDS ? », « Comment calculer ma marge ? » ou « Comment tester mon idée ? »'});
chatMessages.forEach(function(m){var p=document.createElement('p');p.className='chat-message'+(m.role==='user'?' user':'');p.textContent=m.text;log.appendChild(p)});
log.scrollTop=log.scrollHeight}
toggle.onclick=function(){panel.hidden=!panel.hidden;toggle.setAttribute('aria-expanded',!panel.hidden);if(!panel.hidden){render();document.getElementById('chat-input').focus()}};
form.onsubmit=function(e){e.preventDefault();var input=document.getElementById('chat-input'),question=input.value.trim();if(!question)return;
chatMessages.push({role:'user',text:question},{role:'assistant',text:offlineAnswer(question)});
input.value='';render();input.focus()}}
var ADV={logement:'Pense à la colocation et vérifie tes droits à l’APL.',courses:'Fais une liste et compare les prix au kilo.',essence:'Essaie le covoiturage ou regroupe tes trajets.',loisirs:'Choisis une sortie payante par période et privilégie les activités gratuites.',autres:'Regarde si tu peux acheter d’occasion (livres, matériel).'};
function tips(){var P=per(),sp={},w=null,wr=0,msg;
CATS.forEach(function(c){sp[c.id]=0});S.exp.forEach(function(e){if(e.t>=P.s&&e.t<P.e)sp[e.c]=(sp[e.c]||0)+e.a});
